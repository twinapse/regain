experiment_name: retrieval_controllers_split_cifar100
scenario: split_cifar100
num_experiences: 10
backbone:
  name: resnet18
  training:
    num_epochs: 10
    strategy:
      name: replay
      kwargs:
        mem_size: 2000
        batch_size_mem: 128
    optimizer:
      name: sgd
      kwargs:
        lr: 0.1
        momentum: 0.9
        weight_decay: 5e-4
    batch_size: 128
  source_experiment: null
repair:
  budget_per_class: 100
  fit_schedule: per_experience
  num_epochs: 10
  batch_size: 128
eval_batch_size: 128
eval_schedule: final_only
checkpoints_enabled: false
device: auto
seed: 1
deterministic: false
mlflow_tracking_uri: null
mlflow_artifact_uri: null
dataset_path: null
runs:
  - name: logit_bias
    controller:
      name: logit_bias
      kwargs:
        lr: 0.1
  - name: linear_probe
    controller:
      name: linear_probe
      kwargs:
        lr: 0.1
  - name: bic
    controller:
      name: bic
      kwargs: {}
  - name: il2m
    controller:
      name: il2m
      kwargs: {}
  - name: cn
    controller:
      name: cn
      kwargs: {}
  - name: tbbn
    controller:
      name: tbbn
      kwargs: {}
  - name: bace
    controller:
      name: bace
      kwargs: {}
